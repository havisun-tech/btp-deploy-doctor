_schema-version: '3.1'
ID: broken-bookshop
version: 1.0.0
build-parameters:
  before-all:
    - builder: custom
      commands:
        - cds build --production
modules:
  - name: bookshop-srv
    type: nodejs
    path: gen/srv
    parameters:
      memory: 128M
    requires:
      - name: bookshop-db
      - name: bookshop-uaa
  - name: bookshop-db-deployer
    type: hdb
    path: gen/db
resources:
  - name: bookshop-db
    type: com.sap.xs.hdi-container
    parameters:
      service: hana
      service-plan: hdi-shared
  - name: bookshop-auth
    type: org.cloudfoundry.managed-service
    parameters:
      service: xsuaa
      path: ./xs-security.json

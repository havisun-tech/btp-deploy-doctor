_schema-version: '3.1'
ID: orders
version: 1.0.0
build-parameters:
  before-all:
    - builder: custom
      commands:
        - npx cds build --production
modules:
  - name: orders-srv
    type: nodejs
    path: gen/srv
    parameters:
      memory: 2G
    requires:
      - name: orders-db
      - name: orders-auth
    provides:
      - name: srv-api
        properties:
          srv-url: ${default-url}
  - name: orders-db-deployer
    type: hdb
    path: gen/db
    requires:
      - name: orders-db
  - name: orders
    type: approuter.nodejs
    path: app/router
    requires:
      - name: srv-api
        group: destinations
        properties:
          name: srv-api
          url: ~{srv-url}
resources:
  - name: orders-db
    type: com.sap.xs.hdi-container
    parameters:
      service: hana
      service-plan: hdi-shared
  - name: orders-auth
    type: org.cloudfoundry.managed-service
    parameters:
      service: xsuaa
      service-plan: application
      path: ./xs-security.json
      config:
        xsappname: orders-${org}-${space}
        tenant-mode: dedicated
